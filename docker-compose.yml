services:                                           
  database:                                         
    image: postgres:15                              
    env_file:                                       
      - .env                                          
    volumes:                                        
      - postgres_data:/var/lib/postgresql/data
    ports:                                          
      - "5432:5432"

  pipeline:
    build:                                          
      context: .                                    
      dockerfile: scripts/Dockerfile                
    env_file:
      - .env
    depends_on:                                     
      - database

volumes:                                            
  postgres_data: